# arvin-agent-badip: inputs
#
# Copy this file next to the script (./arvin-agent-badip.yaml) or to
# ~/arvin-agent-badip/config.yaml, or pass it with:  --config /path/to/file.yaml
#
# Precedence: script defaults < values found by `init` < this file < command-line flags.
# Leave a value empty to keep the default. Keep the file flat (no nesting).
#
# Secrets: api_key and ssh_key below accept EITHER a file path OR the value itself.
# A value written here is stored in plain text: keep this file private (chmod 600).
# On macOS you can instead leave api_key empty and keep the key in the Keychain:
#   security add-generic-password -U -a "$USER" -s arvin-agent-badip -w

# =============================================================================
# REQUIRED: you must fill these in
# =============================================================================

# Public IPv4 you SSH to (saved as the management IP, never released).
# Several servers: separate them with commas. They are tested at the same time.
management_ip: ""                 # e.g. "185.1.1.10" or "185.1.1.10, 185.2.2.20"

# ArvanCloud region code of the server (in the panel URL: panel.arvancloud.ir/ecc/<region>/servers/...).
# Servers in different regions: `init` searches every region for a server it cannot find here
# and remembers its region. Or give one region per management IP: "ir-thr-ba1, ir-tbz-dc1".
region: ir-thr-ba1

# How a new IP gets configured on the server:
#   panel = ArvanCloud does it (default). No SSH is used; only the API key is needed.
#           The management IP is unusable while a test IP is attached.
#   ssh   = this script configures the new network card over SSH.
vm_config_mode: panel

# SSH access to the VM(s). Only used when vm_config_mode is ssh. The same user and key are used for every server.
ssh_user: hani
# ssh_key, any of:
#   ~/.ssh/id_ed25519.pub              .pub of a key in your ssh-agent (macOS default)
#   ~/.ssh/id_ed25519                  private key file (no agent needed)
#   ssh-ed25519 AAAAC3Nz... me@mac     the public key line itself (agent must hold it)
#   "-----BEGIN OPENSSH PRIVATE KEY-----\nb3Bl...\n-----END OPENSSH PRIVATE KEY-----"
#                                      the private key itself, \n for each line break
#   empty                              any key in the ssh-agent
ssh_key: ~/.ssh/id_ed25519.pub

# =============================================================================
# OPTIONAL: credentials and access
# =============================================================================

# ArvanCloud API key (panel access), either:
#   the key itself:   "apikey 0000000-0000-0000-0000-000000000000"  (the "apikey " prefix is optional)
#   a file path:      ~/arvin-agent-badip/api_key   (file with only the key; chmod 600)
# Empty = $ARVAN_API_KEY, then ~/arvin-agent-badip/api_key, then the macOS Keychain.
api_key: ""

# Firewall for every NEW public IP: the name shown in the panel's Firewall list.
# ArvanCloud refuses a new IP without one.
firewall_name: "Default"
firewall_id: ""                   # optional: the firewall's ID instead of its name

# Server UUID(s). Empty = `init` finds the server that owns each management IP.
# Several servers: one UUID per management IP, comma-separated, same order.
server_id: ""

ssh_port: 22
sudo: "sudo -n"                   # ignored when ssh_user is root
ssh_extra_opts: []                # e.g. ["-o", "ProxyJump=bastion.example"]

# =============================================================================
# OPTIONAL: test run
# =============================================================================

rounds: 5                         # how many test IPs per run (allocate -> test -> release)
checks_per_ip: 2                  # check-host cycles per test IP
round_spacing_sec: 60             # pause between rounds
baseline_check: false             # off: the management IP is known good and is not judged
parallel: true                    # several management IPs: test all servers at the same time
                                  # (false = one server after another)

# Regions tested on every check (check-host.net node country codes).
# "iran" is the Iranian group; every other region counts as "outside Iran".
# one line: region=country codes, regions separated by ";"
probe_regions: "iran=ir; europe=de,nl,fr,gb,se,fi,pl,ch,at,cz,es,it,ro; usa=us; asia=sg,jp,hk,in,kr; other=au,br,za,ca,ae,tr"
probe_per_region: 3

# How "reachable from Iran" is tested (sshd already listens on 0.0.0.0:22).
check_type: tcp                   # tcp | ping | http
check_port: 22
check_http_path: /                # only for check_type: http

# =============================================================================
# OPTIONAL: verdict tuning (defaults are usually fine)
# =============================================================================

# An IP is GOOD only if it is reachable from Iran AND from outside Iran. It is BAD when:
#   Iran only        Iran reaches it, but fewer than outside_min_ok nodes outside Iran do
#   blocked in Iran  nodes outside Iran reach it, but Iran does not
outside_min_ok: 1                 # 1 = "not even one node outside Iran"; 0 turns the Iran-only rule off
min_conclusive_nodes: 3           # nodes that must answer (in Iran, and outside Iran) for a verdict
fail_ratio_threshold: 0.5         # Iran does not reach it if more than this share of Iranian nodes fail
probe_max_nodes: 10
probe_nodes: []                   # [] = all check-host nodes in Iran (auto)
control_nodes: []                 # [] = 3 nodes outside Iran (auto)
iran_control_target: "1.1.1.1:443"

# =============================================================================
# OPTIONAL: safety and timing
# =============================================================================

protect_mgmt_route: true          # pin the management IP's replies to its own NIC
mgmt_watchdog_sec: 90             # VM auto-reverts the pin if a fresh SSH can't confirm it
max_public_ips_per_server: 4      # ArvanCloud per-server cap
# check-host.net pacing (its limits are not documented, so both values are cautious):
check_spacing_sec: 60             # between two checks of the SAME IP
checkhost_min_spacing_sec: 30     # between any two requests, from ALL servers together
# One server alone sends one request per 60 s. Servers tested at the same time interleave, up to
# one request per 30 s. If check-host starts refusing requests, the script waits 2 minutes and
# that check may come out unclear: then set checkhost_min_spacing_sec to 60.
nic_appear_timeout_sec: 120
port_active_timeout_sec: 180
release_timeout_sec: 180
